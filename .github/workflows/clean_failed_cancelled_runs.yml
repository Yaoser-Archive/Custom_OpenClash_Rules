name: Inspect Failed and Cancelled Workflow Runs

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report failures without deleting diagnostic evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | [.id, .name, .head_sha, .conclusion, .html_url] | @tsv' \
            >> "$GITHUB_STEP_SUMMARY"
