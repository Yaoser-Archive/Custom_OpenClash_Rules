name: Auto sync rules from Aethersailor

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cfg/Custom_Clash_Lite.ini'
      - 'rule/*.yaml'
      - '.github/**'

permissions:
  contents: write

concurrency:
  group: lite-main-writers
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Yaoser-Archive/Custom_OpenClash_Rules' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Prepare validation tools
        env:
          TOOLS: ${{ runner.temp }}/lite-tools
        run: |
          set -euo pipefail
          python -m pip install -r .github/requirements.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python .github/scripts/setup_tools.py "$GITHUB_WORKSPACE" "$TOOLS"
      - name: Run failure and contract tests
        env:
          TOOLS: ${{ runner.temp }}/lite-tools
        run: |
          set -euo pipefail
          "$TOOLS/actionlint" .github/workflows/*.yml
          python -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate and publish exact snapshot
        id: publish
        env:
          TOOLS: ${{ runner.temp }}/lite-tools
        run: |
          set -euo pipefail
          python .github/scripts/publication.py \
            --root "$GITHUB_WORKSPACE" --candidate "$TOOLS/candidate" --core "$TOOLS/mihomo"
      - name: Refresh cache and verify client resource bytes
        timeout-minutes: 10
        env:
          PUBLICATION_SHA: ${{ steps.publish.outputs.publication_sha }}
        run: python .github/scripts/cache_refresh.py --publication-sha "$PUBLICATION_SHA"
      - name: Stop isolated validation container
        if: always()
        run: docker rm -f lite-validation
