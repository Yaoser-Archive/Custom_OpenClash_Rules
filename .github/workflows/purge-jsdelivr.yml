name: Purge jsDelivr Cache

# Publication invokes the same script directly after its bot push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite-main-writers
  cancel-in-progress: false

jobs:
  purge:
    if: github.repository == 'Yaoser-Archive/Custom_OpenClash_Rules' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r .github/requirements.txt
      - run: python .github/scripts/cache_refresh.py
        timeout-minutes: 10
